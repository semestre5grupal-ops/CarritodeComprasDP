databases:
  - name: shopsport-db
    databaseName: shopsport
    user: shopsport_user

services:
  # 1. Backend API (Node.js + Express + Prisma)
  - type: web
    name: shopsport-api
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopsport-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      # Por ahora permitimos todos los orígenes, luego puedes ajustarlo a la URL del frontend
      - key: CORS_ORIGIN
        value: "*" 
      - key: NODE_ENV
        value: production

  # 2. Frontend (Vue.js + Vite)
  - type: web
    name: shopsport-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
